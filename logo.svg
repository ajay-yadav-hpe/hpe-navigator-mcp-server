<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400">
  <!-- Background -->
  <rect width="850" height="400" fill="url(#bgGradient)"/>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgb(12, 34, 57)"/>
      <stop offset="100%" stop-color="rgb(31, 2, 2)"/>
    </linearGradient>
  </defs>
  
  <!-- HPE Logo Placeholder -->
  <g id="hpe-logo" transform="translate(200,40)">
    <!-- Replace with your official HPE SVG -->
    <path fill="#01a982" d="M391.2 81.27v35.46H504V144H362.4V54H504v27.27Z"/><path fill="#fff" d="M276.673 0h-89.254v144h28.8v-36.607h60.008c37.914 0 59.692-21.59 59.692-53.395C335.918 21.985 314.14 0 276.673 0m-1.881 79.793h-58.573V27.27h58.573c22.679 0 31.281 10.484 31.281 26.728 0 16.079-8.602 25.795-31.281 25.795M391.2 40.63h-28.8V0H504v27.27H391.2ZM151.2 0v144h-28.8V84.984H28.8V144H0V0h28.8v57.384h93.6V0Z"/>
  </g>
  
  <!-- Navigator Text with Shadow -->
  <text x="450" y="250" font-family="Montserrat, Arial" font-size="80" font-weight="bold"
        fill="url(#silverGradient)" text-anchor="middle" filter="url(#textShadow)">Navigator</text>
  <defs>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#01A982"/>
    </filter>
  </defs>

  <!-- MCP SERVER Text -->
  <text x="450" y="300" font-family="Segoe UI, Arial" font-size="32" font-weight="bold"
        fill="#01A982" text-anchor="middle">MCP SERVER</text>

  <!-- Storage Servers -->
  <g transform="translate(120,220)">
    <rect x="0" y="0" width="100" height="25" rx="3" fill="#333"/>
    <rect x="0" y="40" width="100" height="25" rx="3" fill="#333"/>
    <rect x="0" y="80" width="100" height="25" rx="3" fill="#333"/>
    <circle cx="90" cy="12" r="4" fill="#01A982"/>
    <circle cx="90" cy="52" r="4" fill="#01A982"/>
    <circle cx="90" cy="92" r="4" fill="#01A982"/>
  </g>

  <!-- Radar Screen -->
  <g transform="translate(680,220)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#01A982" stroke-width="2"/>
    <path d="M0,0 L60,0 A60,60 0 0,1 0,60 Z" fill="#01A982" opacity="0.3"/>
    <circle cx="25" cy="15" r="4" fill="#01A982"/>
    <circle cx="-15" cy="-25" r="4" fill="#01A982"/>
  </g>

  <!-- Analytics Dashboard Bars -->
  <g transform="translate(680,240)">
    <rect x="0" y="40" width="20" height="40" fill="#01A982"/>
    <rect x="30" y="20" width="20" height="60" fill="#01A982"/>
    <rect x="60" y="0" width="20" height="80" fill="#01A982"/>
  </g>

  <!-- Heartbeat Line -->
  <g transform="translate(570,270)">
    <path d="M0 20 L20 20 L30 0 L40 40 L50 20 L70 20 L80 10 L90 30 L100 20"
          stroke="#c42100" stroke-width="2" fill="none"/>
  </g>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="silverGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#808080"/>
    </linearGradient>
  </defs>
</svg>
